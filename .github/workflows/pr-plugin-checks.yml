---
# Surfaces W001-W020 and E001-E004 for plugin entries added or modified in a PR.
# Two stages: warnings-check (fast, automatic) and install-check (slow, runs
# `test-install` on the changed plugins).
#
# This runs on `pull_request`, so fork code executes with a read-only token
# and no approval gate is needed. The sticky comment is only posted for
# same-repo PRs, where the token keeps write permission.
name: PR plugin checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - master

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diff-changed:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      changed_count: ${{ steps.diff.outputs.changed_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --no-tags --depth=1 origin master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - id: diff
        run: python .github/scripts/diff_changed_plugins.py

  warnings-check:
    needs: diff-changed
    runs-on: ubuntu-latest
    env:
      CHANGED: ${{ needs.diff-changed.outputs.changed }}
      HAS_CHANGES: ${{ needs.diff-changed.outputs.changed_count != '0' }}
    steps:
      - uses: actions/checkout@v4

      - if: env.HAS_CHANGES == 'true'
        uses: ./.github/actions/create-dev-env

      - name: Fetch metadata for changed plugins
        if: env.HAS_CHANGES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: aiida-registry fetch $CHANGED

      - id: extract
        run: python .github/scripts/extract_pr_findings.py --stage warnings $CHANGED

      - name: Post or update sticky comment
        # Fork tokens are read-only on `pull_request`, so only same-repo PRs
        # can post; forks still see the findings in the logs and the red check.
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          BODY: ${{ steps.extract.outputs.body }}
        with:
          script: |
            const body = process.env.BODY;
            if (!body) return;
            const marker = "<!-- pr-plugin-checks -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => (c.body || "").includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if findings
        if: steps.extract.outputs.has_findings == 'true'
        run: |
          echo "::error::Warnings detected on changed plugin entries."
          exit 1

  install-check:
    needs: [diff-changed, warnings-check]
    if: needs.diff-changed.outputs.changed_count != '0'
    runs-on: ubuntu-latest
    env:
      CHANGED: ${{ needs.diff-changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/create-dev-env

      - name: Fetch metadata for changed plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: aiida-registry fetch $CHANGED

      - name: Test-install changed plugins
        run: aiida-registry test-install $CHANGED

      - id: extract
        run: python .github/scripts/extract_pr_findings.py --stage install $CHANGED

      - name: Post or update sticky comment
        # Fork tokens are read-only on `pull_request`, so only same-repo PRs
        # can post; forks still see the findings in the logs and the red check.
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          BODY: ${{ steps.extract.outputs.body }}
        with:
          script: |
            const body = process.env.BODY;
            if (!body) return;
            const marker = "<!-- pr-plugin-checks -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => (c.body || "").includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if findings
        if: steps.extract.outputs.has_findings == 'true'
        run: |
          echo "::error::Errors detected on changed plugin entries."
          exit 1
